name: online-classroom

services:
  mysql:
    image: mysql:8.4.3
    container_name: classroom-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-classroom_db}
      MYSQL_USER: ${MYSQL_USER:-classroom_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - classroom-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  mongodb:
    image: mongo:7.0.14
    container_name: classroom-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Set MONGO_INITDB_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-classroom_activity}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - classroom-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  neo4j:
    image: neo4j:5.20-community
    container_name: classroom-neo4j
    restart: unless-stopped
    environment:
      # NEO4J_AUTH must be "neo4j/${NEO4J_PASSWORD}" - both are derived from the single
      # NEO4J_PASSWORD value in .env so the neo4j container and the backend's driver credentials
      # can never drift apart (Finding: separate defaults previously let them diverge silently).
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_PLUGINS: '[]'
      NEO4J_dbms_security_auth__minimum__password__length: 8
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
    networks:
      - classroom-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 25s

  minio:
    image: quay.io/minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: classroom-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - classroom-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: classroom-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - classroom-net
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minio_admin} ${MINIO_ROOT_PASSWORD:-minio_password} || exit 1;
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET:-classroom-media} || exit 1;
      /usr/bin/mc stat myminio/${MINIO_BUCKET:-classroom-media} || exit 1;
      echo 'MinIO initialization completed with private bucket enforcement.';
      exit 0;
      "

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: runner
    container_name: classroom-backend
    restart: unless-stopped
    ports:
      # Loopback by default (Finding 1): the demo stack seeds fixed-password accounts and can run
      # the simulated payment rail, so it must not be reachable from other hosts unless the
      # operator explicitly widens HOST_BIND_ADDRESS for a network they control.
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-classroom_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-classroom_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-classroom_pass}
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-mongo_admin}:${MONGO_INITDB_ROOT_PASSWORD:-mongo_pass}@mongodb:27017/${MONGO_INITDB_DATABASE:-classroom_activity}?authSource=admin
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: ${NEO4J_USER:-neo4j}
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      MINIO_ENDPOINT: http://minio:9000
      # Presigned URLs are consumed by the host browser, so use the published loopback endpoint.
      MINIO_EXTERNAL_ENDPOINT: ${MINIO_EXTERNAL_ENDPOINT:-http://localhost:${MINIO_PORT:-9000}}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-classroom-media}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env to a unique value (see .env.example)}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      MOCK_PAYMENT_WEBHOOK_SECRET: ${MOCK_PAYMENT_WEBHOOK_SECRET:?Set MOCK_PAYMENT_WEBHOOK_SECRET in .env to a unique value (see .env.example)}
      # Demo-only switches, all fail-closed here (Finding 1). The local Docker stack is the
      # documented way to exercise the purchase -> entitlement flow, so infra/.env turns these on
      # explicitly for local use; the compose default stays OFF so a stack brought up without that
      # opt-in has no simulated payment rail and no fixed-password demo accounts.
      # Never enable any of them in an internet-facing deployment.
      PAYMENT_SANDBOX_ENABLED: ${PAYMENT_SANDBOX_ENABLED:-false}
      MOCK_PAYMENT_CHECKOUT_ENABLED: ${MOCK_PAYMENT_CHECKOUT_ENABLED:-false}
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:80,http://127.0.0.1:3000
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - classroom-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/api/v1/health/readiness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 40s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: runner
      args:
        # Demo-only, opt-in via infra/.env (Finding 1).
        VITE_ENABLE_DEMO_LOGIN: ${VITE_ENABLE_DEMO_LOGIN:-false}
    container_name: classroom-frontend
    restart: unless-stopped
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - classroom-net

  backend-test:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: tester
    container_name: classroom-backend-test
    profiles:
      - test
    environment:
      SPRING_PROFILES_ACTIVE: test
    networks:
      - classroom-net

  frontend-test:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: tester
    container_name: classroom-frontend-test
    profiles:
      - test

networks:
  classroom-net:
    driver: bridge

volumes:
  mysql-data:
  mongodb-data:
  neo4j-data:
  minio-data:
