spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

# Exclude MongoDB & Neo4j auto-configuration during standard tests
spring.data.mongodb.repositories.enabled=false
spring.data.neo4j.repositories.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.neo4j.Neo4jAutoConfiguration,org.springframework.boot.autoconfigure.data.neo4j.Neo4jDataAutoConfiguration,org.springframework.boot.autoconfigure.data.neo4j.Neo4jRepositoriesAutoConfiguration

app.jwt.secret=test-secret-key-for-unit-testing-at-least-32-chars-long
app.jwt.expiration-hours=1
minio.endpoint=http://localhost:9000
minio.external-endpoint=http://localhost:9000
minio.access-key=test_minio
minio.secret-key=test_minio
minio.bucket=test-bucket
app.payment.mock.webhook-secret=test-webhook-secret-key-32-chars-long
classroom.payment.mock.checkout.enabled=true
classroom.projection.mongo.enabled=false
classroom.projection.neo4j.enabled=false

# Unit tests run against an in-memory H2 database that is never exposed; they rely on the demo dataset.
classroom.seed.demo.enabled=true

# D-19: the membership-expiry sweeper is a background thread that touches the database on its own clock. The suite's statement-count
# and state assertions must not race it, so it is off here; tests drive MembershipExpirySweeper / MembershipExpiryService directly (and one
# test turns the real timer on to prove the wiring).
classroom.membership.expiry.enabled=false
minio.secret-key=test-only-minio-secret-key
