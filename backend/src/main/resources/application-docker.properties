# Docker environment overrides (development/local use only)
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Security-sensitive secrets: no in-application fallback. docker compose requires JWT_SECRET and
# MOCK_PAYMENT_WEBHOOK_SECRET to be set (see infra/compose.yaml's ${VAR:?...} guards backed by
# infra/.env / .env), and DevSecretGuard additionally refuses any value copy-pasted from the
# repository's own published samples.
app.jwt.secret=${JWT_SECRET}
app.payment.mock.webhook-secret=${MOCK_PAYMENT_WEBHOOK_SECRET}
classroom.payment.sandbox.enabled=${PAYMENT_SANDBOX_ENABLED:false}
classroom.payment.mock.checkout.enabled=${MOCK_PAYMENT_CHECKOUT_ENABLED:false}
