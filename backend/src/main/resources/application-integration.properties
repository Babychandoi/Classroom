# Integration test profile running against live Docker containers: MySQL (with Flyway), MongoDB, Neo4j, MinIO
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.data.mongodb.repositories.enabled=true
spring.data.neo4j.repositories.enabled=true
classroom.projection.mongo.enabled=true
classroom.projection.neo4j.enabled=true
app.jwt.secret=${JWT_SECRET:super-secret-key-for-dev-environment-at-least-32-chars-long}
app.jwt.expiration-hours=1
app.payment.mock.webhook-secret=${MOCK_PAYMENT_WEBHOOK_SECRET:dev-mock-webhook-secret-key-32-chars-minimum}
classroom.payment.sandbox.enabled=true
classroom.payment.mock.checkout.enabled=true

# Integration tests run against the loopback-bound Docker containers and rely on the demo dataset.
classroom.seed.demo.enabled=true

# D-19: off so a timer cannot flip a lapsed member in the middle of a test; the tests call the sweeper themselves (one turns the real timer on).
classroom.membership.expiry.enabled=false
