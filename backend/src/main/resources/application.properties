spring.application.name=online-classroom-backend
server.port=8080

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Actuator & Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=OPS
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Default DataSource (can be overridden by environment)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/classroom_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:classroom_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:classroom_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MongoDB
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://mongo_admin:mongo_pass@localhost:27017/classroom_activity?authSource=admin}

# Neo4j
spring.neo4j.uri=${SPRING_NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${SPRING_NEO4J_AUTHENTICATION_USERNAME:neo4j}
spring.neo4j.authentication.password=${SPRING_NEO4J_AUTHENTICATION_PASSWORD:classroom_neo4j_pass_2026}

# MinIO S3 Object Storage
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.external-endpoint=${MINIO_EXTERNAL_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minio_admin}
minio.secret-key=${MINIO_SECRET_KEY:minio_password}
minio.bucket=${MINIO_BUCKET:classroom-media}

# JWT Authentication
# SECURITY: No fallback default - application will fail to start if JWT_SECRET is not set in production
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}

# Mock Payment & Webhook
# SECURITY: No fallback default - application will fail to start if MOCK_PAYMENT_WEBHOOK_SECRET is not set
app.payment.mock.webhook-secret=${MOCK_PAYMENT_WEBHOOK_SECRET}
classroom.payment.sandbox.enabled=${PAYMENT_SANDBOX_ENABLED:false}
classroom.payment.mock.checkout.enabled=${MOCK_PAYMENT_CHECKOUT_ENABLED:false}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:80,http://127.0.0.1:3000}

# Outbox Projections
classroom.projection.mongo.enabled=${PROJECTION_MONGO_ENABLED:true}
classroom.projection.neo4j.enabled=${PROJECTION_NEO4J_ENABLED:true}

# Demo dataset with fixed-password accounts. Fails closed: seeding only happens on an
# explicit opt-in, and only under the dev/test/docker profiles (see DataSeedRunner).
classroom.seed.demo.enabled=${DEMO_SEED_ENABLED:false}
